# ==============================================================================
# AMAZON / MRK ZONE E-COMMERCE PLATFORM - UNIFIED MASTER CONFIGURATION
# File: application.properties
# Purpose: Single consolidated configuration file for Frontend, Backend, Database,
#          Payments (Razorpay & Dynamic UPI QR), Delivery, JWT Auth, and Storage.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. SERVER CONFIGURATION
# ------------------------------------------------------------------------------
server.port=${PORT:8080}
server.servlet.context-path=/
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# ------------------------------------------------------------------------------
# 2. SPRING APPLICATION IDENTITY
# ------------------------------------------------------------------------------
spring.application.name=mrkzone-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# ------------------------------------------------------------------------------
# 3. DATABASE CONFIGURATION
# Supports local zero-config persistent H2 (PostgreSQL compatibility mode)
# AND seamless production PostgreSQL deployment via environment variables.
# ------------------------------------------------------------------------------
# Local Embedded & Persistent Database (PostgreSQL mode)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/mrkzone;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ------------------------------------------------------------------------------
# 4. H2 WEB CONSOLE (For debugging & inspection)
# ------------------------------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ------------------------------------------------------------------------------
# 5. JPA & HIBERNATE CONFIGURATION
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20

# ------------------------------------------------------------------------------
# 6. MULTIPART FILE UPLOADS (Supports high-res product photos & product videos)
# ------------------------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB
mrkzone.upload.dir=${UPLOAD_DIR:./uploads}

# ------------------------------------------------------------------------------
# 7. STATIC RESOURCES & ASSETS
# Serves React Frontend (dist/ -> static/) and uploaded media files
# ------------------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/,file:./uploads/
spring.web.resources.cache.period=360

# ------------------------------------------------------------------------------
# 8. SECURITY & JWT AUTHENTICATION
# ------------------------------------------------------------------------------
# 256-bit secure HMAC secret key
mrkzone.jwt.secret=${JWT_SECRET}
mrkzone.admin.email=${ADMIN_EMAIL:admin@mrkzone.com}
mrkzone.admin.password=${ADMIN_PASSWORD}
mrkzone.admin.name=${ADMIN_NAME:Store Administrator}
# Token Expiration: 7 Days (604800000 ms)
mrkzone.jwt.expiration-ms=604800000

# ------------------------------------------------------------------------------
# 9. WAREHOUSE & DELIVERY MANAGEMENT
# Base Dispatch Warehouse: PIN 400072 (Mumbai, Maharashtra)
# ------------------------------------------------------------------------------
mrkzone.warehouse.pincode=400072
mrkzone.warehouse.city=Mumbai
mrkzone.warehouse.state=Maharashtra
mrkzone.warehouse.country=India

# Shipping Rules & Thresholds
mrkzone.shipping.free-shipping-threshold=499.0
mrkzone.shipping.standard-shipping-charge=40.0
mrkzone.shipping.express-shipping-charge=99.0

# ------------------------------------------------------------------------------
# 10. DYNAMIC UPI PAYMENT & MERCHANT CONFIGURATION
# Real scannable Indian UPI QR code generation
# ------------------------------------------------------------------------------
mrkzone.merchant.upi-id=${MERCHANT_UPI_ID:}
mrkzone.merchant.name=${MERCHANT_NAME:}
mrkzone.merchant.mcc=5411

# ------------------------------------------------------------------------------
# 11. PAYMENT GATEWAYS (Razorpay / PayU Integration)
# ------------------------------------------------------------------------------
mrkzone.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_AmazonMockKey}
mrkzone.razorpay.key-secret=${RAZORPAY_KEY_SECRET:AmazonMockSecret12345}
mrkzone.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:AmazonWebhookSecret}

# ------------------------------------------------------------------------------
# 12. CLOUDFLARE R2 / S3 OBJECT STORAGE (Optional Production Asset Storage)
# ------------------------------------------------------------------------------
mrkzone.storage.provider=${STORAGE_PROVIDER:local}
mrkzone.storage.r2.account-id=${R2_ACCOUNT_ID:}
mrkzone.storage.r2.access-key=${R2_ACCESS_KEY:}
mrkzone.storage.r2.secret-key=${R2_SECRET_KEY:}
mrkzone.storage.r2.bucket-name=${R2_BUCKET_NAME:amazon-store}
mrkzone.storage.r2.public-url=${R2_PUBLIC_URL:}

# ------------------------------------------------------------------------------
# 13. EMAIL SERVICE (SMTP / Resend)
# ------------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ------------------------------------------------------------------------------
# 14. LOGGING CONFIGURATION
# ------------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.mrkzone=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
